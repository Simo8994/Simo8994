<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crea prompt video</title>

  <!-- ===== 1. CSS: l'aspetto della pagina ===== -->
  <style>
    :root {
      --sfondo: #f6f4ef;
      --carta: #ffffff;
      --testo: #1f2328;
      --tenue: #6b7280;
      --accento: #e2622b;
      --bordo: #e3dfd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sfondo: #15171a;
        --carta: #1f2226;
        --testo: #eceae5;
        --tenue: #9aa0a8;
        --accento: #ff8a52;
        --bordo: #30343a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--sfondo);
      color: var(--testo);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    .sottotitolo { color: var(--tenue); margin: 0 0 24px; }
    .scheda {
      background: var(--carta);
      border: 1px solid var(--bordo);
      border-radius: 14px;
      padding: 18px;
    }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      font-size: 1rem;
      color: var(--testo);
      background: var(--sfondo);
      border: 1px solid var(--bordo);
      border-radius: 10px;
    }
    .riga { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accento);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button.secondario {
      color: var(--testo);
      background: transparent;
      border: 1px solid var(--bordo);
      margin-top: 12px;
    }
    #risultato { margin-top: 20px; }
    #prompt {
      margin: 0;
      white-space: pre-wrap;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.92rem;
    }
    [hidden] { display: none; }
  </style>
</head>

<body>
  <!-- ===== 2. HTML: il contenuto della pagina ===== -->
  <main>
    <h1>Crea prompt video</h1>
    <p class="sottotitolo">Scegli gli ingredienti, ottieni un prompt in inglese pronto da incollare in un generatore di video.</p>

    <form id="modulo" class="scheda">
      <label for="soggetto">Protagonista</label>
      <select id="soggetto">
        <option value="a happy toddler in a light blue onesie">Bambino piccolo</option>
        <option value="an elderly man with a kind smile">Nonno</option>
        <option value="a young woman in a cozy sweater">Ragazza</option>
        <option value="a curious golden retriever puppy">Cucciolo di cane</option>
      </select>

      <label for="compagno">Con chi interagisce</label>
      <select id="compagno">
        <option value="a fluffy orange tabby kitten">Gattino</option>
        <option value="a baby goat">Capretta</option>
        <option value="a small white duckling">Anatroccolo</option>
        <option value="a gentle brown rabbit">Coniglio</option>
      </select>

      <label for="azione">Cosa succede (in inglese, facoltativo)</label>
      <input id="azione" type="text" placeholder="es. they play together and laugh">

      <div class="riga">
        <div>
          <label for="ambiente">Ambiente</label>
          <select id="ambiente">
            <option value="on a soft living room rug, cozy blurred sofa in the background">Salotto</option>
            <option value="on green grass in front of an old wooden farmhouse">Fattoria</option>
            <option value="in a sunny garden full of flowers">Giardino</option>
            <option value="on a sandy beach near gentle waves">Spiaggia</option>
          </select>
        </div>
        <div>
          <label for="luce">Luce</label>
          <select id="luce">
            <option value="warm golden afternoon light">Tramonto</option>
            <option value="soft overcast daylight">Nuvoloso</option>
            <option value="bright morning sunlight">Mattino</option>
          </select>
        </div>
      </div>

      <div class="riga">
        <div>
          <label for="formato">Formato</label>
          <select id="formato">
            <option value="Vertical 9:16">Verticale 9:16</option>
            <option value="Horizontal 16:9">Orizzontale 16:9</option>
          </select>
        </div>
        <div>
          <label for="audio">Audio</label>
          <select id="audio">
            <option value="si">Con suoni</option>
            <option value="no">Muto</option>
          </select>
        </div>
      </div>

      <button type="submit">Crea prompt</button>
    </form>

    <section id="risultato" class="scheda" hidden>
      <p id="prompt"></p>
      <button id="copia" type="button" class="secondario">Copia</button>
    </section>
  </main>

  <!-- ===== 3. JavaScript: il comportamento della pagina ===== -->
  <script>
    // Prende un elemento della pagina a partire dal suo id.
    const el = (id) => document.getElementById(id);

    // Mette insieme le scelte dell'utente in un'unica frase.
    function creaPrompt() {
      const azione = el('azione').value.trim() || 'they play together gently and joyfully';
      const parti = [
        `${el('formato').value} handheld smartphone video, photorealistic.`,
        `${maiuscola(el('soggetto').value)} and ${el('compagno').value}, ${el('ambiente').value}: ${azione}.`,
        `${maiuscola(el('luce').value)}, shallow depth of field, natural textures, subtle camera shake.`,
        el('audio').value === 'si'
          ? 'Audio: natural ambient sounds matching the scene.'
          : 'No audio.',
        'No text, no subtitles, no watermark.'
      ];
      return parti.join(' ');
    }

    function maiuscola(testo) {
      return testo.charAt(0).toUpperCase() + testo.slice(1);
    }

    // Quando si preme "Crea prompt": calcola il testo e lo mostra.
    el('modulo').addEventListener('submit', (evento) => {
      evento.preventDefault(); // evita che la pagina si ricarichi
      el('prompt').textContent = creaPrompt();
      el('risultato').hidden = false;
      el('copia').textContent = 'Copia';
    });

    // Quando si preme "Copia": mette il testo negli appunti.
    el('copia').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(el('prompt').textContent);
        el('copia').textContent = 'Copiato ✓';
      } catch {
        el('copia').textContent = 'Copia non riuscita: seleziona il testo a mano';
      }
    });
  </script>
</body>
</html>
