<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricevuto — Ci parlo io</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --sfondo: #faf7f2; --testo: #1c1f23; --tenue: #5f6672; --accento: #d9480f; }
    @media (prefers-color-scheme: dark) {
      :root { --sfondo: #131518; --testo: #edeae4; --tenue: #a0a6b0; --accento: #ff7a3d; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--sfondo); color: var(--testo);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; padding: 24px; text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--tenue); margin: 0 0 24px; }
    a { color: var(--accento); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Ricevuto.</h1>
    <p>Abbiamo la tua richiesta. Ti ricontattiamo al recapito che ci hai lasciato.</p>
    <a href="/">Torna alla pagina principale</a>
  </main>
</body>
</html>
