<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richiesta ricevuta — Vetrina Viva</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <style>
    :root { --sfondo: #f7f8fc; --testo: #0c1226; --tenue: #586079; --accento: #cf3a12; }
    @media (prefers-color-scheme: dark) {
      :root { --sfondo: #090d1b; --testo: #eef1fa; --tenue: #9aa3bd; --accento: #ff8463; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--sfondo); color: var(--testo);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; padding: 24px; text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 12px; }
    p { color: var(--tenue); margin: 0 0 24px; }
    a { color: var(--accento); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Richiesta ricevuta.</h1>
    <p>Ti ricontattiamo al recapito che ci hai lasciato per definire i dettagli del tuo sito.</p>
    <a href="/">Torna alla pagina principale</a>
  </main>
</body>
</html>
